<script>
(function(){
"use strict";

var APP="OP Site Management - Office";
var VERSION="1.5.22";
var KEY="op-site-cloud-v01-cache";
var PROFILE_KEY="op-site-cloud-profile-cache";
var SUPABASE_URL="https://ffzdrqelwzncchtbdxqs.supabase.co";
var SUPABASE_KEY="sb_publishable_SG5ty5m_K4JKupvdSkCegg_cQbhtEux";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
var cloud={session:null,profile:null,loading:true,syncText:"☁️ Synced"};
var state={projects:[],reportTemplateName:"",reportTemplateData:"",pendingOps:[]};
var view={smartFilter:null,areaFilter:null,areaKeys:[],tempPhoto:'',draft:null,screen:"projects",projectId:"",tab:"today",filter:"all",itemId:"",pdfBlob:null,pdfUrl:"",pdfName:"",includeDone:false};

function q(id){return document.getElementById(id)}
function esc(s){s=String(s==null?"":s);return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).substr(2,7)}
function isoToday(){var d=new Date();var y=d.getFullYear();var m=("0"+(d.getMonth()+1)).slice(-2);var day=("0"+d.getDate()).slice(-2);return y+"-"+m+"-"+day}
function stamp(){return new Date().toISOString()}
function fmt(d){if(!d)return "—";var x=new Date(d+"T12:00:00");return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert("Could not save data on this device.");return false}}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var x=JSON.parse(raw);if(x&&x.projects instanceof Array)state=x}if(!(state.pendingOps instanceof Array))state.pendingOps=[];(state.projects||[]).forEach(function(p){(p.items||[]).forEach(function(i){if(p.cloud&&!i.cloudId&&i.id&&String(i.id).indexOf("id")!==0)i.cloudId=i.id})})}catch(e){state={projects:[],reportTemplateName:"",reportTemplateData:"",pendingOps:[]}}}

function cloudLoginView(){return '<div class="loginWrap"><div class="loginLogo">OP Site Management - Office</div><div class="sub" style="margin:4px 0 28px">Simple site control</div><div class="card"><div class="section" style="margin-top:0">ENTER YOUR PIN</div><input id="loginPin" class="pinInput" inputmode="numeric" maxlength="4" type="password" autocomplete="one-time-code" onkeyup="if(event.key===\'Enter\')App.login()"><button id="loginBtn" class="btn primary block" style="margin-top:14px" onclick="App.login()">Continue</button><div id="loginErr" class="loginErr"></div></div><div class="version">'+APP+' · '+VERSION+'</div></div>'}
async function loginWithPin(){var pin=(q("loginPin")||{}).value||"";if(!/^\d{4}$/.test(pin)){q("loginErr").textContent="Enter your 4-digit PIN.";return}q("loginBtn").disabled=true;q("loginErr").textContent="Signing in…";try{var r=await fetch(SUPABASE_URL+"/functions/v1/op-pin-auth",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({pin:pin})});var j=await r.json();if(!r.ok||!j.token_hash)throw new Error(j.error||"Login failed");var v=await sb.auth.verifyOtp({token_hash:j.token_hash,type:"email"});if(v.error)throw v.error;await initCloud();setTimeout(function(){refreshCloudUI(true)},60)}catch(e){q("loginErr").textContent=e.message||"Login failed";q("loginBtn").disabled=false}}
async function initCloud(){cloud.loading=true;var ss=await sb.auth.getSession();cloud.session=ss.data.session;if(!cloud.session){cloud.profile=null;cloud.loading=false;render();return}var cached=null;try{cached=JSON.parse(localStorage.getItem(PROFILE_KEY)||"null")}catch(e){}if(cached&&cached.id){cloud.profile=cached;cloud.loading=false;cloud.syncText="☁️ Ready";render()}var u=cloud.session.user.id;var pr=await sb.from("profiles").select("id,display_name,global_role,status").eq("auth_user_id",u).single();if(pr.error){if(!cloud.profile){cloud.loading=false;render()}return}if(!pr.data||pr.data.status!=="active"){await sb.auth.signOut();cloud.session=null;cloud.profile=null;try{localStorage.removeItem(PROFILE_KEY)}catch(e){}cloud.loading=false;render();return}cloud.profile=pr.data;try{localStorage.setItem(PROFILE_KEY,JSON.stringify(pr.data))}catch(e){}cloud.loading=false;cloud.syncText="☁️ Ready";render()}
function pendingCount(){return state.pendingOps instanceof Array?state.pendingOps.length:0}
function updateSyncText(){var n=pendingCount();cloud.syncText=n?("☁️ "+n+" change"+(n===1?"":"s")+" waiting to sync"):"☁️ Synced"}
function queueItem(p,i){if(!p||!i)return;if(!(state.pendingOps instanceof Array))state.pendingOps=[];var key=i.id,found=null;for(var x=0;x<state.pendingOps.length;x++){var op=state.pendingOps[x];if(op.type==="item"&&op.projectId===p.id&&op.itemId===key){found=op;break}}var snap=JSON.parse(JSON.stringify(i));if(found){found.item=snap;found.updatedAt=stamp()}else state.pendingOps.push({type:"item",projectId:p.id,itemId:key,item:snap,updatedAt:stamp()});save();updateSyncText()}
function clearPendingItem(projectId,itemId){if(!(state.pendingOps instanceof Array))state.pendingOps=[];state.pendingOps=state.pendingOps.filter(function(op){return !(op.type==="item"&&op.projectId===projectId&&op.itemId===itemId)});save();updateSyncText()}
async function sendItemToCloud(p,i){if(!cloud.profile||!p||!p.cloud)return false;var table=i.kind==="issue"?"issues":"tasks";if(!i.cloudId)i.cloudId=(crypto&&crypto.randomUUID)?crypto.randomUUID():uid().replace(/^id/,"")+"-0000-4000-8000-000000000000";var payload=JSON.parse(JSON.stringify(i));delete payload.id;delete payload.cloudId;delete payload.kind;var row={id:i.cloudId,project_id:p.id,data:payload,updated_by:cloud.profile.id,created_by:cloud.profile.id};var r=await sb.from(table).upsert(row,{onConflict:"id"}).select("id").single();if(r.error)throw r.error;return true}
async function flushPending(){if(!cloud.profile||!cloud.session)return false;if(!(state.pendingOps instanceof Array)||!state.pendingOps.length){updateSyncText();return true}var ops=state.pendingOps.slice(),failed=[];cloud.syncText="☁️ Syncing…";for(var z=0;z<ops.length;z++){var op=ops[z];if(op.type!=="item")continue;var p=state.projects.find(function(x){return x.id===op.projectId});if(!p){continue}var local=p.items&&p.items.find(function(x){return x.id===op.itemId});var item=local||op.item;try{await sendItemToCloud(p,item);if(local&&item.cloudId)local.cloudId=item.cloudId}catch(e){op.item=JSON.parse(JSON.stringify(item));failed.push(op)}}state.pendingOps=failed;save();updateSyncText();return failed.length===0}
function mergePendingIntoProjects(out){if(!(state.pendingOps instanceof Array)||!state.pendingOps.length)return out;state.pendingOps.forEach(function(op){if(op.type!=="item")return;var p=out.find(function(x){return x.id===op.projectId});if(!p)return;var localProject=state.projects.find(function(x){return x.id===op.projectId});var local=localProject&&localProject.items&&localProject.items.find(function(x){return x.id===op.itemId});var item=JSON.parse(JSON.stringify(local||op.item||{}));if(!item.id)item.id=op.itemId;var idx=-1;for(var j=0;j<p.items.length;j++){if((item.cloudId&&p.items[j].id===item.cloudId)||p.items[j].id===item.id){idx=j;break}}if(idx>=0)p.items[idx]=item;else p.items.unshift(item)});return out}

function canAutoRefresh(){
 // Never redraw a form while the user is typing/editing: a cloud refresh calls render()
 // and would otherwise replace the inputs and erase unsaved text.

 if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return false;
 return true
}

function project(){var i;for(i=0;i<state.projects.length;i++){if(state.projects[i].id===view.projectId)return state.projects[i]}return null}
function currentItem(){var p=project(),i;if(!p)return null;for(i=0;i<p.items.length;i++){if(p.items[i].id===view.itemId)return p.items[i]}return null}
function isDone(i){return i.status==="done"}
function daysLate(d){if(!d)return 0;var a=new Date(isoToday()+"T12:00:00");var b=new Date(d+"T12:00:00");return Math.floor((a-b)/86400000)}
function reminderDue(i){if(isDone(i)||!i.reminderAt||i.materialStatus!=="ordered")return false;return daysLate(i.reminderAt)>=0}
function overdueDays(i){if(!reminderDue(i))return 0;return Math.max(0,daysLate(i.reminderAt))}
function isOverdue(i){return false}
function isReady(i){return !isDone(i)&&i.requiresMaterial&&(i.materialStatus==="received"||i.materialStatus==="installed")}
function bucket(i){if(reminderDue(i))return "follow";if(i.requiresMaterial&&i.materialStatus==="ordered")return "waiting";return "do"}
function counts(p){var r={open:0,done:0,over:0,follow:0,ready:0},i,x;for(i=0;i<p.items.length;i++){x=p.items[i];if(isDone(x))r.done++;else r.open++;if(reminderDue(x))r.follow++;if(isReady(x))r.ready++}return r}

// Refresh when the app returns to the foreground and periodically while it is open,
// but never redraw while the user is editing or a modal is open.

}

// and lets the worker stage the newest index.html for the next launch.

 window.addEventListener("load",function(){
  navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(function(reg){
   reg.update().catch(function(){});

}
